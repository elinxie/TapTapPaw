; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; plain "pio run" keeps building the normal firmware; WiFi mode is the opt-in esp32dev_wifi env below
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions/littlefs_1mb_ota.csv
monitor_speed = 115200
lib_deps = 
	lovyan03/LovyanGFX@^1.2.7
	lvgl/lvgl@^8.3.11
	electroniccats/MPU6050@^1.4.4
build_flags = 
	-D CORE_DEBUG_LEVEL=3
	-D LV_CONF_INCLUDE_SIMPLE
	-D USE_DAC_AUDIO
	-I src
	-I src/ui
	-I include

; WiFi mode (docs/WIFI_MODE.md): NTP time + Open-Meteo weather without a computer.
; WiFi does not fit the 1.44 MB app partition, so this env uses a table without the second OTA slot
; (app partition 2.75 MB, nvs and LittleFS offsets unchanged). Build/flash: pio run -d sketch -e esp32dev_wifi -t upload
[env:esp32dev_wifi]
extends = env:esp32dev
board_build.partitions = partitions/littlefs_noota.csv
build_flags =
	${env:esp32dev.build_flags}
	-D ENABLE_WIFI=1

; Bluetooth keyboard (docs/WIDGETS.md, "Buttons"): button widgets can send key shortcuts and media keys to a paired computer.
; Same partition table as the WiFi build (Bluetooth does not fit the 1.44 MB slot); nvs and LittleFS keep their offsets.
; Bluetooth only: WiFi and Bluetooth together leave too little RAM on this chip. Build/flash: pio run -d sketch -e esp32dev_ble -t upload
[env:esp32dev_ble]
extends = env:esp32dev
board_build.partitions = partitions/littlefs_noota.csv
lib_deps =
	${env:esp32dev.lib_deps}
	t-vk/ESP32 BLE Keyboard@^0.3.2
	h2zero/NimBLE-Arduino@~1.4.3
build_flags =
	${env:esp32dev.build_flags}
	-D ENABLE_BLE_KEYS=1
	-D USE_NIMBLE
